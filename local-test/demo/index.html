<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walt.id Identity Stack — Test Data Flow</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0f1e;
  color: #e2e8f0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
header {
  padding: 14px 24px;
  background: linear-gradient(135deg, #111827 0%, #0a0f1e 100%);
  border-bottom: 1px solid #1e293b;
  flex-shrink: 0;
}
header h1 { font-size: 1.1rem; color: #f1f5f9; font-weight: 600; }
header p  { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

.tabs { display: flex; gap: 6px; margin-top: 12px; }
.tab {
  padding: 6px 18px;
  border-radius: 6px;
  border: 1px solid #1e293b;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 500;
  transition: all 0.18s;
}
.tab:hover { background: #1e293b; color: #cbd5e1; }
.tab.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
.tab .badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 10px;
  background: rgba(255,255,255,0.15);
  font-size: 0.68rem;
}

/* ── Main layout ─────────────────────────────────────────────────────────── */
.main {
  display: grid;
  grid-template-columns: 300px 1fr;
  flex: 1;
  min-height: 0;
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar {
  background: #111827;
  border-right: 1px solid #1e293b;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 10px 14px;
  border-bottom: 1px solid #1e293b;
  font-size: 0.68rem;
  color: #475569;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.play-btn {
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px solid #334155;
  background: #1e293b;
  color: #94a3b8;
  cursor: pointer;
  font-size: 0.7rem;
  transition: all 0.15s;
}
.play-btn:hover { background: #334155; color: #e2e8f0; }
.play-btn.playing { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }

.step-list { overflow-y: auto; flex: 1; }

.step-item {
  padding: 9px 14px;
  border-bottom: 1px solid #0f172a;
  cursor: pointer;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: background 0.12s;
}
.step-item:hover { background: #1e293b; }
.step-item.active { background: #1e3a5f; border-left: 3px solid #3b82f6; padding-left: 11px; }

.step-num {
  min-width: 28px;
  text-align: center;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-family: 'SF Mono', 'Fira Code', monospace;
  background: #1e293b;
  color: #64748b;
  flex-shrink: 0;
  margin-top: 1px;
}
.step-item.active .step-num { background: #1d4ed8; color: #bfdbfe; }

.step-info { flex: 1; min-width: 0; }
.step-title { font-size: 0.82rem; color: #cbd5e1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-item.active .step-title { color: #93c5fd; }

.step-meta { font-size: 0.68rem; color: #475569; margin-top: 2px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-item.active .step-meta { color: #60a5fa; }

.actor-dots { display: flex; gap: 3px; margin-top: 4px; }
.actor-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  opacity: 0.5;
}
.step-item.active .actor-dot { opacity: 1; }

/* ── Diagram area ────────────────────────────────────────────────────────── */
.diagram-area {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0a0f1e;
}

.diagram-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
}

#diagram-svg {
  display: block;
  width: 100%;
}

/* ── Details panel ───────────────────────────────────────────────────────── */
.details-panel {
  border-top: 1px solid #1e293b;
  background: #111827;
  padding: 14px 20px;
  flex-shrink: 0;
  max-height: 260px;
  overflow-y: auto;
}
.details-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: #f1f5f9;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.details-desc {
  font-size: 0.78rem;
  color: #94a3b8;
  line-height: 1.55;
  margin-bottom: 12px;
}
.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.detail-box {
  background: #0a0f1e;
  border-radius: 6px;
  border: 1px solid #1e293b;
  padding: 10px 12px;
}
.detail-box.full { grid-column: 1 / -1; }
.detail-box label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: #475569;
  display: block;
  margin-bottom: 5px;
}
.detail-box pre {
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 0.72rem;
  color: #7dd3fc;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
}
.detail-box pre.response { color: #86efac; }

.method-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 3px;
  font-size: 0.68rem;
  font-weight: 700;
  font-family: monospace;
  letter-spacing: 0.03em;
}
.badge-POST { background: #14532d; color: #86efac; border: 1px solid #16a34a; }
.badge-GET  { background: #1e3a8a; color: #93c5fd; border: 1px solid #2563eb; }

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #334155;
  font-size: 0.85rem;
}

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #334155; }

/* ── Internal step note ─────────────────────────────────────────────────── */
.internal-note {
  font-size: 0.68rem;
  color: #64748b;
  font-style: italic;
  margin-top: 6px;
  padding-left: 8px;
  border-left: 2px solid #334155;
}
</style>
</head>

<body>
<header>
  <h1>Walt.id Identity Stack — Local Test Data Flow</h1>
  <p>Interactive sequence diagrams for the three end-to-end test scripts</p>
  <div class="tabs">
    <button class="tab active" data-flow="mdoc">
      ISO 18013-5 mDL <span class="badge">14 steps</span>
    </button>
    <button class="tab" data-flow="jwtvc">
      W3C JWT VC <span class="badge">16 steps</span>
    </button>
    <button class="tab" data-flow="sdjwt">
      SD-JWT VC <span class="badge">16 steps</span>
    </button>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <span id="sidebar-label">Steps</span>
      <button class="play-btn" id="play-btn">▶ Play</button>
    </div>
    <div class="step-list" id="step-list"></div>
  </div>

  <div class="diagram-area">
    <div class="diagram-scroll" id="diagram-scroll">
      <svg id="diagram-svg"></svg>
    </div>
    <div class="details-panel" id="details-panel">
      <div class="empty-state">← Select a step to see details</div>
    </div>
  </div>
</div>

<script>
// ─── Actor definitions ───────────────────────────────────────────────────────
const ACTORS = {
  script:   { label: 'Test Script',       port: '',      color: '#818cf8' },
  wallet:   { label: 'Wallet API',        port: ':7001', color: '#34d399' },
  issuer:   { label: 'Issuer API',        port: ':7002', color: '#fbbf24' },
  verifier: { label: 'Verifier API',      port: ':7003', color: '#f87171' },
};
const ACTOR_ORDER = ['script', 'wallet', 'issuer', 'verifier'];

// ─── Flow data ───────────────────────────────────────────────────────────────
const FLOWS = {

  // ── mDL ────────────────────────────────────────────────────────────────────
  mdoc: {
    title: 'ISO 18013-5 mDL',
    subtitle: 'Mobile Driver\'s Licence — OID4VCI + OID4VP (ISO 18013-7)',
    file: 'test-mdoc-flow.sh',
    steps: [
      { n:'0', title:'Register Account',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/auth/register',
        req:'{\n  "type": "email", "name": "Test",\n  "email": "test@email.com",\n  "password": "test"\n}',
        res:'HTTP 201 Created\n(or 409 — account exists, continue)',
        desc:'Create a wallet account. HTTP 409 is ignored so the script is idempotent.' },

      { n:'1', title:'Login',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/auth/login',
        req:'{\n  "type": "email",\n  "email": "test@email.com",\n  "password": "test"\n}',
        res:'{ "token": "eyJhbGci..." }',
        desc:'Obtain a JWT bearer token used for all subsequent wallet API calls.' },

      { n:'2', title:'Get Wallet ID',
        from:'script', to:'wallet', method:'GET',
        endpoint:'/wallet-api/wallet/accounts/wallets',
        req:'Authorization: Bearer <token>',
        res:'{ "wallets": [{ "id": "c341..." }] }',
        desc:'Retrieve the wallet ID. Used as a path parameter in every exchange call.' },

      { n:'3', title:'Create IACA Certificate',
        from:'script', to:'issuer', method:'POST',
        endpoint:'/onboard/iso-mdl/iacas',
        req:'{\n  "certificateData": {\n    "country": "US",\n    "commonName": "Test IACA",\n    "issuerAlternativeNameConf": {\n      "uri": "https://iaca.example.com"\n    }\n  }\n}',
        res:'{\n  "iacaKey": {...},\n  "certificateData": {...},\n  "certificatePEM": "-----BEGIN CERTIFICATE-----\\n..."\n}',
        desc:'Generate an Issuing Authority CA (IACA) key + self-signed certificate. The IACA is the root of trust for all mDLs. Its PEM is later passed as trusted_root_cas to the verifier.' },

      { n:'4', title:'Create Document Signer Certificate',
        from:'script', to:'issuer', method:'POST',
        endpoint:'/onboard/iso-mdl/document-signers',
        req:'{\n  "iacaSigner": { "iacaKey": {...}, "certificateData": {...} },\n  "certificateData": {\n    "country": "US",\n    "commonName": "Test DS",\n    "crlDistributionPointUri": "https://iaca.example.com/crl"\n  }\n}',
        res:'{\n  "documentSignerKey": {...},\n  "certificatePEM": "-----BEGIN CERTIFICATE-----\\n..."\n}',
        desc:'Generate a Document Signer (DS) key + certificate signed by the IACA. The DS key signs each mDL credential. Only the DS cert goes in x5Chain; the IACA cert is a trusted root.' },

      { n:'5', title:'Issuer Well-Known Config',
        from:'script', to:'issuer', method:'GET',
        endpoint:'/draft13/.well-known/openid-configuration',
        req:'(no body)',
        res:'{\n  "issuer": "http://host.docker.internal:7002/draft13",\n  "credential_endpoint": "...",\n  "grant_types_supported": ["...pre-authorized_code"]\n}',
        desc:'Confirm the issuer supports OID4VCI Draft 13 and the pre-authorized_code grant.' },

      { n:'6', title:'Create mDL Credential Offer',
        from:'script', to:'issuer', method:'POST',
        endpoint:'/openid4vc/mdoc/issue',
        req:'{\n  "issuerKey": { <DS key> },\n  "credentialConfigurationId": "org.iso.18013.5.1.mDL",\n  "mdocData": {\n    "org.iso.18013.5.1": {\n      "family_name": "Doe", "given_name": "John",\n      "birth_date": "1986-03-22", "document_number": "123456789",\n      "driving_privileges": [...], ...\n    }\n  },\n  "x5Chain": ["<DS cert PEM>"],\n  "authenticationMethod": "PRE_AUTHORIZED"\n}',
        res:'"openid-credential-offer://?credential_offer_uri=http%3A%2F%2F..."',
        desc:'Issue an mDL credential offer. x5Chain must contain only the DS certificate (single entry) — the IACA is not included here. The offer URI is returned as a plain string.' },

      { n:'7', title:'Inspect Offer Content',
        from:'script', to:'issuer', method:'GET',
        endpoint:'/draft13/credentialOffer?id=<offer_id>',
        req:'(no body)',
        res:'{\n  "credential_issuer": "...",\n  "credential_configuration_ids": ["org.iso.18013.5.1.mDL"],\n  "grants": { "urn:ietf:params:oauth:grant-type:pre-authorized_code": { "pre-authorized_code": "..." } }\n}',
        desc:'Verify the credential offer contains the correct mDL type and a pre-authorized_code grant.' },

      { n:'8', title:'Claim mDL (Wallet ← Issuer)',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/wallet/{id}/exchange/useOfferRequest',
        internal:{ from:'wallet', to:'issuer', label:'OID4VCI: token + credential endpoints' },
        req:'"openid-credential-offer://?credential_offer_uri=http://host.docker.internal:7002/..."',
        res:'[{\n  "id": "cbcf8f88-...",\n  "format": "mso_mdoc",\n  "document": "o2d2ZXJzaW9u..."\n}]',
        desc:'The wallet fetches the mDL from the issuer using the OID4VCI pre-authorized code flow. The offer URI is rewritten from localhost → host.docker.internal so the wallet (inside Docker) can reach the host.' },

      { n:'9', title:'Create OID4VP Auth Request',
        from:'script', to:'verifier', method:'POST',
        endpoint:'/openid4vc/verify',
        req:'Headers:\n  responseMode: direct_post_jwt\n  openId4VPProfile: ISO_18013_7_MDOC\n\nBody:\n{\n  "request_credentials": [{\n    "id": "mDL-request",\n    "input_descriptor": {\n      "id": "org.iso.18013.5.1.mDL",\n      "format": { "mso_mdoc": { "alg": ["ES256"] } },\n      "constraints": {\n        "fields": [\n          { "path": ["$[\'org.iso.18013.5.1\'][\'family_name\']"] },\n          { "path": ["$[\'org.iso.18013.5.1\'][\'birth_date\']"] }, ...\n        ],\n        "limit_disclosure": "required"\n      }\n    }\n  }],\n  "trusted_root_cas": ["<IACA PEM>"],\n  "openid_profile": "ISO_18013_7_MDOC"\n}',
        res:'"openid4vp://authorize?response_type=vp_token&client_id=...&request_uri=http%3A%2F%2F...%2F<state>&state=<state>"',
        desc:'Create an OID4VP authorization request with ISO 18013-7 profile. The IACA PEM is the trust anchor. The session ID (STATE) is the last path segment of the decoded request_uri.' },

      { n:'10', title:'Decode Request JWT & Match Credentials',
        from:'script', to:'verifier', method:'GET',
        endpoint:'/openid4vc/request/<state>',
        extra:{ from:'script', to:'wallet', method:'POST',
                endpoint:'/exchange/matchCredentialsForPresentationDefinition',
                req:'<presentation_definition from JWT payload>',
                res:'[{ "id": "cbcf8f88-..." }]' },
        req:'(no body — returns signed JAR JWT)',
        res:'Signed JWT with payload:\n{ "presentation_definition": { "id": "...", "input_descriptors": [...] } }',
        desc:'Fetch the signed JAR (JWT Authorization Request) from the verifier, base64-decode the payload to extract presentation_definition, then call matchCredentialsForPresentationDefinition on the wallet. Falls back to claimed credential ID if matching returns empty.' },

      { n:'11', title:'Resolve Presentation Request',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/wallet/{id}/exchange/resolvePresentationRequest',
        req:'"openid4vp://authorize?...&request_uri=http://host.docker.internal:7003/..."',
        res:'"openid4vp://authorize?response_type=vp_token&client_id=...&nonce=...&request_uri=..."',
        desc:'The wallet fetches and verifies the JAR, resolving the full authorization request. The URL is rewritten localhost → host.docker.internal.' },

      { n:'12', title:'Fulfill Presentation (Wallet → Verifier)',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/wallet/{id}/exchange/usePresentationRequest',
        internal:{ from:'wallet', to:'verifier', label:'POST DeviceResponse (direct_post_jwt)' },
        req:'{\n  "presentationRequest": "openid4vp://...",\n  "selectedCredentials": ["cbcf8f88-..."]\n}',
        res:'{ "redirectUri": "" }',
        desc:'The wallet generates an ISO 18013-5 DeviceResponse, signs it with the device key, and sends it to the verifier\'s response_uri via direct_post_jwt. The response is bound to the wallet\'s cnf key.' },

      { n:'13', title:'Check Verification Result',
        from:'script', to:'verifier', method:'GET',
        endpoint:'/openid4vc/session/<state>',
        req:'(no body)',
        res:'{\n  "id": "<state>",\n  "verificationResult": "true"\n}',
        desc:'Poll the verifier session. verificationResult == "true" means all checks passed: mDL DeviceResponse signature, DS cert chain to trusted IACA, matching presentation definition, and field constraints.' },
    ]
  },

  // ── JWT VC ─────────────────────────────────────────────────────────────────
  jwtvc: {
    title: 'W3C JWT VC',
    subtitle: 'Verifiable Credential (jwt_vc_json) — OID4VCI Draft 13 + OID4VP',
    file: 'test-vc-vp-flow.sh',
    steps: [
      { n:'0', title:'Register Account',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/auth/register',
        req:'{ "type": "email", "name": "Test", "email": "...", "password": "..." }',
        res:'HTTP 201 Created  (409 → continue)',
        desc:'Create a wallet account. Idempotent — HTTP 409 is silently ignored.' },

      { n:'1', title:'Login',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/auth/login',
        req:'{ "type": "email", "email": "...", "password": "..." }',
        res:'{ "token": "eyJhbGci..." }',
        desc:'Obtain a JWT bearer token.' },

      { n:'2', title:'Get Wallet ID',
        from:'script', to:'wallet', method:'GET',
        endpoint:'/wallet-api/wallet/accounts/wallets',
        req:'Authorization: Bearer <token>',
        res:'{ "wallets": [{ "id": "c341..." }] }',
        desc:'Retrieve the wallet ID for use as a path parameter.' },

      { n:'3', title:'List Keys',
        from:'script', to:'wallet', method:'GET',
        endpoint:'/wallet-api/wallet/{id}/keys',
        req:'Authorization: Bearer <token>',
        res:'[{ "keyId": { "id": "kePn..." }, "algorithm": "secp256r1" }]',
        desc:'List the wallet\'s cryptographic keys. The key ID binds issued credentials to the holder.' },

      { n:'4', title:'Retrieve DID',
        from:'script', to:'wallet', method:'GET',
        endpoint:'/wallet-api/wallet/{id}/dids',
        req:'Authorization: Bearer <token>',
        res:'[{ "did": "did:jwk:eyJ...", "default": true }]',
        desc:'Retrieve the wallet\'s DID. Used as the credential subject (credentialSubject.id) in the mapping.' },

      { n:'5', title:'Issuer Well-Known Config',
        from:'script', to:'issuer', method:'GET',
        endpoint:'/draft13/.well-known/openid-configuration',
        req:'(no body)',
        res:'{ "issuer": "http://host.docker.internal:7002/draft13", "credential_endpoint": "...", ... }',
        desc:'Confirm OID4VCI Draft 13 endpoint metadata.' },

      { n:'6', title:'Onboard Issuer',
        from:'script', to:'issuer', method:'POST',
        endpoint:'/onboard/issuer',
        req:'{ "key": { "keyType": "secp256r1" } }',
        res:'{\n  "issuerKey": { "type": "jwk", "jwk": {...} },\n  "issuerDid": "did:jwk:eyJ..."\n}',
        desc:'Generate a fresh issuer key pair and DID on-the-fly. issuerKey signs the credential; issuerDid becomes the iss / issuer claim.' },

      { n:'7', title:'Create JWT VC Credential Offer',
        from:'script', to:'issuer', method:'POST',
        endpoint:'/openid4vc/jwt/issue',
        req:'{\n  "issuerKey": {...},\n  "issuerDid": "did:jwk:...",\n  "credentialConfigurationId": "UniversityDegree_jwt_vc_json",\n  "credentialData": {\n    "@context": ["https://www.w3.org/2018/credentials/v1", ...],\n    "type": ["VerifiableCredential", "UniversityDegree"],\n    "credentialSubject": { "degree": { "type": "BachelorDegree", "name": "..." } }\n  },\n  "mapping": {\n    "id": "<uuid>",\n    "issuer": { "id": "<issuerDid>" },\n    "credentialSubject": { "id": "<subjectDid>" },\n    "issuanceDate": "<timestamp>",\n    "expirationDate": "<timestamp-in:365d>"\n  },\n  "authenticationMethod": "PRE_AUTHORIZED",\n  "standardVersion": "DRAFT13"\n}',
        res:'"openid-credential-offer://?credential_offer_uri=http%3A%2F%2F..."',
        desc:'Issue a UniversityDegree JWT VC. Placeholders in mapping are substituted at issuance: <uuid> → random UUID, <issuerDid>/<subjectDid> → resolved DIDs, <timestamp> → current time, <timestamp-in:365d> → 1 year expiry.' },

      { n:'8/9', title:'Inspect Offer Content',
        from:'script', to:'issuer', method:'GET',
        endpoint:'/draft13/credentialOffer?id=<offer_id>',
        req:'(no body)',
        res:'{\n  "credential_configuration_ids": ["UniversityDegree_jwt_vc_json"],\n  "grants": { "urn:ietf:params:oauth:grant-type:pre-authorized_code": {...} }\n}',
        desc:'Inspect the credential offer to verify type and grant.' },

      { n:'10', title:'Claim JWT VC (Wallet ← Issuer)',
        from:'script', to:'wallet', method:'POST',
        endpoint:'/wallet-api/wallet/{id}/exchange/useOfferRequest',
        internal:{ from:'wallet', to:'issuer', label:'OID4VCI: token + credential endpoints' },
        req:'"openid-credential-offer://?credential_offer_uri=http://host.docker.internal:7002/..."',
        res:'[{\n  "id": "urn:uuid:...",\n  "format": "jwt_vc_json",\n  "document": "eyJhbGci..."\n}]',
        desc:'The wallet claims the JWT VC from the issuer using OID4VCI pre-authorized code. Offer URI is rewritten localhost → host.docker.internal.' },

      { n:'11', title:'Create OID4VP Auth Request',
        from:'script', to:'verifier', method:'POST',
        endpoint:'/openid4vc/verify',
        req:'Headers:\n  responseMode: direct_post\n  authorizeBaseUrl: openid4vp://authorize\n\nBody:\n{\n  "request_credentials": [{\n    "type": "UniversityDegree",\n    "format": "jwt_vc_json"\n  }]\n}',
        res:'"openid4vp://authorize?response_type=vp_token&state=<state>&presentation_definition_uri=http%3A%2F%2F..."',
        desc:'Request a UniversityDegree JWT VC. The verifier generates a presentation definition and returns the OID4VP authorization URL with presentation_definition_uri. The state is the session ID.' },

      { n:'12', title:'Fetch Presentation Definition & Match',
        from:'script', to:'verifier', method:'GET',
        endpoint:'/openid4vc/pd/<state>',
        extra:{ from:'script', to:'wallet', method:'POST',
                endpoint:'/exchange/matchCredentialsForPresentationDefinition',
                req:'<presentation_definition JSON>',

};

// ─── State ───────────────────────────────────────────────────────────────────
let currentFlow = 'mdoc';
let activeStepIdx = null;
let playTimer = null;

// ─── Helpers ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function escSvg(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Render sidebar ───────────────────────────────────────────────────────────
function renderSidebar() {
  const flow = FLOWS[currentFlow];
  const list = document.getElementById('step-list');
  document.getElementById('sidebar-label').textContent =
    `${flow.steps.length} steps — ${flow.file}`;

  list.innerHTML = flow.steps.map((s, i) => {
    const fromC = ACTORS[s.from].color;
    const toC   = ACTORS[s.to].color;
    const isActive = i === activeStepIdx;
    return `
      <div class="step-item${isActive ? ' active' : ''}" data-idx="${i}">
        <div class="step-num">${s.n}</div>
        <div class="step-info">
          <div class="step-title">${escHtml(s.title)}</div>
          <div class="step-meta">${s.method} ${escHtml(s.endpoint)}</div>
          <div class="actor-dots">
            <div class="actor-dot" style="background:${fromC}" title="${s.from}"></div>
            <div class="actor-dot" style="background:#334155;width:12px;border-radius:2px"></div>
            <div class="actor-dot" style="background:${toC}" title="${s.to}"></div>
          </div>
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => setActiveStep(parseInt(el.dataset.idx)));
  });
}

// ─── Render SVG diagram ───────────────────────────────────────────────────────
function renderDiagram() {
  const flow = FLOWS[currentFlow];
  const svg  = document.getElementById('diagram-svg');
  const W    = svg.parentElement.clientWidth || 760;

  const PAD_L = 50;  // left padding for step numbers
  const PAD_R = 20;
  const ACTOR_W = 100;
  const ACTOR_H = 48;
  const ACTOR_Y = 16;
  const ROW_H   = 60; // normal step height
  const ROW_H_X = 80; // step with extra sub-arrow
  const STEPS_Y = ACTOR_Y + ACTOR_H + 30;

  // Actor X positions
  const usableW = W - PAD_L - PAD_R;
  const aXs = {};
  ACTOR_ORDER.forEach((k, i) => {
    aXs[k] = PAD_L + Math.round((i / (ACTOR_ORDER.length - 1)) * usableW);
  });

  // Calculate total SVG height
  let totalH = STEPS_Y;
  const rowYs = [];
  flow.steps.forEach(s => {
    rowYs.push(totalH);
    totalH += (s.extra ? ROW_H_X : ROW_H);
  });
  totalH += 30;

  svg.setAttribute('viewBox', `0 0 ${W} ${totalH}`);
  svg.setAttribute('height', totalH);
  svg.setAttribute('width', W);

  let h = '';

  // ── Defs: arrowhead markers ──
  h += `<defs>
    <marker id="mA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3b82f6"/></marker>
    <marker id="mN" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#475569"/></marker>
    <marker id="mI" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#64748b"/></marker>
  </defs>`;

  // ── Lifelines ──
  ACTOR_ORDER.forEach(k => {
    const x = aXs[k];
    h += `<line x1="${x}" y1="${ACTOR_Y + ACTOR_H}" x2="${x}" y2="${totalH - 20}"
            stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,5"/>`;
  });

  // ── Actor boxes ──
  ACTOR_ORDER.forEach(k => {
    const a = ACTORS[k];
    const x = aXs[k];
    const bx = x - ACTOR_W / 2;
    h += `
      <rect x="${bx}" y="${ACTOR_Y}" width="${ACTOR_W}" height="${ACTOR_H}"
            rx="7" fill="${a.color}22" stroke="${a.color}" stroke-width="1.5"/>
      <text x="${x}" y="${ACTOR_Y + 18}" text-anchor="middle"
            fill="${a.color}" font-size="12" font-weight="600"
            font-family="-apple-system,system-ui">${escSvg(a.label)}</text>
      <text x="${x}" y="${ACTOR_Y + 34}" text-anchor="middle"
            fill="${a.color}aa" font-size="10"
            font-family="'SF Mono','Fira Code',monospace">${escSvg(a.port)}</text>`;
  });

  // ── Steps ──
  flow.steps.forEach((s, i) => {
    const y      = rowYs[i];
    const rowH   = s.extra ? ROW_H_X : ROW_H;
    const isAct  = i === activeStepIdx;
    const midY   = y + (s.extra ? 22 : rowH / 2);

    const x1 = aXs[s.from];
    const x2 = aXs[s.to];
    const goRight = x2 > x1;
    const ax1 = goRight ? x1 + 8  : x1 - 8;
    const ax2 = goRight ? x2 - 12 : x2 + 12;

    const color   = isAct ? '#3b82f6' : '#334155';
    const lColor  = isAct ? '#93c5fd' : '#64748b';
    const bgOpacity = isAct ? 0.12 : 0;
    const strokeW = isAct ? 2 : 1.5;
    const marker  = isAct ? 'mA' : 'mN';

    // Row highlight
    if (isAct) {
      h += `<rect x="0" y="${y}" width="${W}" height="${rowH}"
              fill="#1d4ed8" opacity="0.1" rx="3"/>`;
    }

    // Step number
    h += `<text x="${PAD_L - 14}" y="${midY + 4}" text-anchor="middle"
            fill="${lColor}" font-size="10" font-weight="600"
            font-family="'SF Mono','Fira Code',monospace">${escSvg(s.n)}</text>`;

    // Main arrow
    h += `<line x1="${ax1}" y1="${midY}" x2="${ax2}" y2="${midY}"
            stroke="${color}" stroke-width="${strokeW}" marker-end="url(#${marker})"/>`;

    // Arrow label (method + truncated endpoint)
    const epShort = s.endpoint.length > 38 ? s.endpoint.slice(0, 38) + '…' : s.endpoint;
    const lx = (x1 + x2) / 2;
    h += `<text x="${lx}" y="${midY - 6}" text-anchor="middle"
            fill="${lColor}" font-size="10"
            font-family="'SF Mono','Fira Code',monospace">${escSvg(s.method + ' ' + epShort)}</text>`;

    // Internal dashed arrow
    if (s.internal) {
      const iy  = midY + 22;
      const ix1 = aXs[s.internal.from];
      const ix2 = aXs[s.internal.to];
      const ig  = ix2 > ix1;
      const iax1 = ig ? ix1 + 8 : ix1 - 8;
      const iax2 = ig ? ix2 - 12 : ix2 + 12;
      const ilx  = (ix1 + ix2) / 2;
      h += `
        <line x1="${iax1}" y1="${iy}" x2="${iax2}" y2="${iy}"
              stroke="#475569" stroke-width="1" stroke-dasharray="5,3"
              marker-end="url(#mI)"/>
        <text x="${ilx}" y="${iy - 5}" text-anchor="middle"
              fill="#475569" font-size="9" font-style="italic"
              font-family="-apple-system,system-ui">${escSvg(s.internal.label)}</text>`;
    }

    // Extra sub-arrow (two-call steps)
    if (s.extra) {
      const ey  = midY + 38;
      const ex1 = aXs[s.extra.from];
      const ex2 = aXs[s.extra.to];
      const eg  = ex2 > ex1;
      const eax1 = eg ? ex1 + 8 : ex1 - 8;
      const eax2 = eg ? ex2 - 12 : ex2 + 12;
      const elx  = (ex1 + ex2) / 2;
      const eColor = isAct ? '#818cf8' : '#334155';
      const eMark  = isAct ? 'mA' : 'mN';
      h += `
        <line x1="${eax1}" y1="${ey}" x2="${eax2}" y2="${ey}"
              stroke="${eColor}" stroke-width="${isAct ? 1.5 : 1}"
              marker-end="url(#${eMark})"/>
        <text x="${elx}" y="${ey - 6}" text-anchor="middle"
              fill="${isAct ? '#a5b4fc' : '#475569'}" font-size="10"
              font-family="'SF Mono','Fira Code',monospace">${escSvg(s.extra.method + ' ' + s.extra.endpoint)}</text>`;
    }
  });

  // ── Actor footer boxes (mirror at bottom) ──
  ACTOR_ORDER.forEach(k => {
    const a = ACTORS[k];
    const x = aXs[k];
    const bx = x - ACTOR_W / 2;
    const by = totalH - ACTOR_H - 4;
    h += `
      <rect x="${bx}" y="${by}" width="${ACTOR_W}" height="${ACTOR_H - 4}"
            rx="7" fill="${a.color}22" stroke="${a.color}" stroke-width="1" opacity="0.5"/>
      <text x="${x}" y="${by + 15}" text-anchor="middle"
            fill="${a.color}88" font-size="10"
            font-family="-apple-system,system-ui">${escSvg(a.label)}</text>`;
  });

  svg.innerHTML = h;
}

// ─── Render details panel ─────────────────────────────────────────────────────
function renderDetails() {
  const panel = document.getElementById('details-panel');
  if (activeStepIdx === null) {
    panel.innerHTML = '<div class="empty-state">← Select a step to see details</div>';
    return;
  }
  const s = FLOWS[currentFlow].steps[activeStepIdx];
  const mb = `<span class="method-badge badge-${s.method}">${s.method}</span>`;

  let extra = '';
  if (s.extra) {
    const eb = `<span class="method-badge badge-${s.extra.method}">${s.extra.method}</span>`;
    extra = `
      <div class="detail-box full">
        <label>Also calls — ${eb} <code style="font-size:0.75rem;color:#93c5fd">${escHtml(s.extra.endpoint)}</code></label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
          <div><label style="font-size:0.65rem;color:#475569;text-transform:uppercase;display:block;margin-bottom:3px">Request</label>
            <pre>${escHtml(s.extra.req)}</pre></div>
          <div><label style="font-size:0.65rem;color:#475569;text-transform:uppercase;display:block;margin-bottom:3px">Response</label>
            <pre class="response">${escHtml(s.extra.res)}</pre></div>
        </div>
      </div>`;
  }

  panel.innerHTML = `
    <div class="details-title">
      <span style="color:${ACTORS[s.from].color}">●</span>
      Step ${escHtml(s.n)} — ${escHtml(s.title)}
      ${mb}
      <code style="font-size:0.78rem;color:#7dd3fc">${escHtml(s.endpoint)}</code>
    </div>
    <div class="details-desc">${escHtml(s.desc)}</div>
    <div class="details-grid">
      <div class="detail-box">
        <label>Request body / headers</label>
        <pre>${escHtml(s.req)}</pre>
      </div>
      <div class="detail-box">
        <label>Response</label>
        <pre class="response">${escHtml(s.res)}</pre>
      </div>
      ${extra}
    </div>`;
}

// ─── Set active step ──────────────────────────────────────────────────────────
function setActiveStep(idx) {
  activeStepIdx = idx;
  renderSidebar();
  renderDiagram();
  renderDetails();

  // Scroll sidebar to active item
  const list = document.getElementById('step-list');
  const active = list.querySelector('.step-item.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // Scroll diagram to show active row
  const flow = FLOWS[currentFlow];
  const svg  = document.getElementById('diagram-svg');
  const totalSteps = flow.steps.length;
  const svgH = parseFloat(svg.getAttribute('height')) || 0;
  const approxY = (80 + idx * 60) / svgH;
  const scrollEl = document.getElementById('diagram-scroll');
  const targetScroll = approxY * scrollEl.scrollHeight - scrollEl.clientHeight / 2;
  scrollEl.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
}

// ─── Switch flow ──────────────────────────────────────────────────────────────
function switchFlow(key) {
  stopPlay();
  currentFlow = key;
  activeStepIdx = null;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.flow === key));
  renderSidebar();
  renderDiagram();
  renderDetails();
  document.getElementById('diagram-scroll').scrollTop = 0;
}

// ─── Auto-play ────────────────────────────────────────────────────────────────
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  document.getElementById('play-btn').textContent = '▶ Play';
  document.getElementById('play-btn').classList.remove('playing');
}

function togglePlay() {
  if (playTimer) { stopPlay(); return; }
  const flow = FLOWS[currentFlow];
  if (activeStepIdx === null || activeStepIdx >= flow.steps.length - 1) {
    setActiveStep(0);
  }
  document.getElementById('play-btn').textContent = '⏹ Stop';
  document.getElementById('play-btn').classList.add('playing');
  playTimer = setInterval(() => {
    const next = (activeStepIdx === null ? 0 : activeStepIdx + 1);
    if (next >= flow.steps.length) { stopPlay(); return; }
    setActiveStep(next);
  }, 1800);
}

// ─── Keyboard nav ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const flow = FLOWS[currentFlow];
  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    setActiveStep(Math.min(flow.steps.length - 1, (activeStepIdx ?? -1) + 1));
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    setActiveStep(Math.max(0, (activeStepIdx ?? 1) - 1));
  } else if (e.key === ' ') {
    e.preventDefault();
    togglePlay();
  }
});

// ─── Wire up tabs & play button ───────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => switchFlow(t.dataset.flow)));
document.getElementById('play-btn').addEventListener('click', togglePlay);

// ─── Re-render on resize ──────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderDiagram, 120);
});

// ─── Initial render ───────────────────────────────────────────────────────────
renderSidebar();
renderDiagram();
renderDetails();
</script>
